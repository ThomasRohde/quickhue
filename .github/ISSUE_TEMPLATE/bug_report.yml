name: Bug report
description: Report a reproducible problem with QuickHue
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include a Hue application key,
        bridge certificate, bridge address, or exported QuickHue configuration.

  - type: input
    id: version
    attributes:
      label: QuickHue version
      description: Release tag or commit SHA
      placeholder: v1.0.0
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true

  - type: dropdown
    id: bridge
    attributes:
      label: Hue Bridge
      options:
        - Hue Bridge v2
        - Hue Bridge Pro
        - Other or unknown
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized logs or screenshots if useful.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed application keys, bridge addresses, certificates, and other private data.
          required: true
